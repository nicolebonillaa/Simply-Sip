spring.datasource.url=jdbc:mysql://localhost:3306/simply_sip
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
server.port=8080

spring.profiles.active=local

jwt.secret=${JWT_SECRET:SimplySipDevSecretKeyThatIsLongEnoughForHS256Algorithm!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081}

app.import.enabled=${APP_IMPORT_ENABLED:false}
app.import.folder=${APP_IMPORT_FOLDER:import/scraped}

