app.geocode.min-interval-ms=${APP_GEOCODE_MIN_INTERVAL_MS:1100}

app.recommendations.default-radius-miles=${APP_REC_RADIUS_MILES:2}
app.recommendations.default-limit=${APP_REC_LIMIT:10}
app.recommendations.weight-category=${APP_REC_WEIGHT_CATEGORY:0.40}
app.recommendations.weight-nutrition=${APP_REC_WEIGHT_NUTRITION:0.30}
app.recommendations.weight-popularity=${APP_REC_WEIGHT_POPULARITY:0.20}
